<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>COS 提示词生成器 — 浏览器测试版</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    /* 浏览器测试版：恢复网页的正常页面滚动（面板版的滚动容器会限制高度） */
    html, body { height: auto; overflow: visible; }
    body { max-width: 560px; margin: 0 auto; padding: 16px; }
    .app { height: auto; overflow: visible; }
    .banner {
      background: #2f2a1f; border: 1px solid #5a4a24; border-left: 3px solid #c9a227;
      color: #c9bd9a; font-size: 11px; padding: 8px 10px; border-radius: 3px;
      margin-bottom: 12px; line-height: 1.6;
    }
    .banner b { color: #e0c460; }
    .hist-item { cursor: pointer; }
  </style>
</head>
<body>

  <!-- ============================================================
       UXP 环境桩：让插件的 index.js 能直接在浏览器里运行
       （复用同一份逻辑代码，避免两份实现产生偏差）
       ============================================================ -->
  <script>
    window.require = function (name) {
      if (name === "uxp") {
        return {
          storage: {
            formats: { utf8: "utf8", binary: "binary" },
            localFileSystem: {
              // 浏览器里把"保存文件"实现为浏览器下载
              getFileForSaving: function (suggested) {
                return Promise.resolve({
                  name: suggested,
                  write: function (content) {
                    var blob = new Blob([content], { type: "text/plain;charset=utf-8" });
                    var a = document.createElement("a");
                    a.href = URL.createObjectURL(blob);
                    a.download = suggested;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    return Promise.resolve();
                  }
                });
              },
              // 浏览器安全限制：不支持直接写任意目录
              getEntryWithUrl: function () {
                return Promise.reject(new Error("浏览器测试版不支持直接写目录，请用「另存为…」"));
              }
            }
          }
        };
      }
      if (name === "clipboard") {
        return {
          copy: function (t) {
            if (navigator.clipboard) navigator.clipboard.writeText(t);
            else {
              var ta = document.createElement("textarea");
              ta.value = t; document.body.appendChild(ta); ta.select();
              document.execCommand("copy"); document.body.removeChild(ta);
            }
          }
        };
      }
      if (name === "photoshop") {
        throw new Error("浏览器环境无 Photoshop"); // 让 index.js 的 try/catch 捕获
      }
      throw new Error("unknown module: " + name);
    };
  </script>

  <div class="app">

    <div class="banner">
      <b>浏览器测试版</b> — 与 PS 插件共用同一份 <code>index.js</code> 逻辑，用于在不装 Photoshop 的情况下验证
      API 连通性与提示词效果。<br />
      注意：「导出到目录」在浏览器不可用（安全限制），请用「另存为…」（会触发浏览器下载）。
    </div>

    <header class="hdr">
      <div class="hdr-title">COS 后期提示词生成器</div>
      <div class="hdr-sub">填你自己的 API，生成专业后期提示词</div>
    </header>

    <section class="card">
      <div class="card-head clickable" id="settingsToggle">
        <span>API 与导出设置</span>
        <span class="chev" id="chev">▾</span>
      </div>
      <div class="card-body" id="settingsBody">
        <label class="lbl">接口地址（Base URL）</label>
        <input id="baseUrl" class="inp" placeholder="https://api.deepseek.com/v1" />

        <label class="lbl">API Key</label>
        <input id="apiKey" class="inp" type="password" placeholder="sk-..." />

        <label class="lbl">模型名</label>
        <input id="model" class="inp" placeholder="deepseek-chat" />

        <label class="lbl">目标模型（输出格式）</label>
        <select id="targetModel" class="inp">
          <option value="nanobanana">Nano Banana（插件预设信封）</option>
          <option value="midjourney">Midjourney（自然语言 + 参数）</option>
          <option value="comfyui">ComfyUI / SD（tag + 权重 + 参数）</option>
          <option value="novelai">NovelAI（Danbooru 标签）</option>
        </select>

        <label class="lbl">导出目录（浏览器测试版不可用）</label>
        <input id="exportDir" class="inp" placeholder="（PS 插件中填写，如 C:/Users/你/Downloads）" />

        <div class="row">
          <button id="saveCfg" class="btn btn-sm">保存设置</button>
          <button id="clearCfg" class="btn btn-sm btn-ghost">清除</button>
        </div>

        <div class="notice">
          <div class="notice-title">安全说明</div>
          <div>· 本工具<b>不内置任何密钥</b>，必须由你填入自己的 API Key</div>
          <div>· Key 只保存在你本机浏览器，除你指定的接口地址外<b>不会发往任何第三方</b></div>
        </div>
      </div>
    </section>

    <section class="card">
      <label class="lbl">你的需求</label>
      <textarea id="request" class="ta" rows="4"
        placeholder="例：给这张 COS 照脚下加一个金色魔法阵，CG 质感，明显一点"></textarea>

      <div class="chips">
        <span class="chip" data-tpl="给这张照片脚下加一个金色魔法阵，CG 质感，明显一点">加魔法阵</span>
        <span class="chip" data-tpl="修脸自然一点，祛痘印和黑眼圈，头发加点亮晶晶">修脸+亮晶晶发</span>
        <span class="chip" data-tpl="背景换成赛博朋克雨夜，冷色调，霓虹灯光">赛博夜景</span>
        <span class="chip" data-tpl="瘦腰，加沙漏身材，衣服绷紧一点">身材塑形</span>
        <span class="chip" data-tpl="想要王家卫电影那种感觉，霓虹撞色，雨夜街道">电影风格</span>
      </div>

      <div class="row">
        <button id="gen" class="btn btn-primary">生成提示词</button>
        <button id="useDoc" class="btn btn-ghost btn-sm">带上文档信息</button>
      </div>
      <div id="status" class="status"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <span>生成结果</span>
        <span class="card-actions">
          <button id="copy" class="btn btn-sm">复制</button>
          <button id="exportQuick" class="btn btn-sm">导出到目录</button>
          <button id="save" class="btn btn-sm btn-ghost">另存为…</button>
        </span>
      </div>
      <textarea id="output" class="ta out" rows="12" placeholder="生成结果会显示在这里…"></textarea>
    </section>

    <section class="card">
      <div class="card-head">
        <span>历史记录 <span id="histCount" class="count">0</span></span>
        <span class="card-actions">
          <button id="clearHistory" class="btn btn-sm btn-ghost">清空</button>
        </span>
      </div>
      <div id="historyList" class="history">
        <div class="empty">暂无记录</div>
      </div>
    </section>

  </div>

  <script src="../index.js"></script>
</body>
</html>
