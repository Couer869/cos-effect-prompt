<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- ============================================================
         视图 1：首次配置（登录页）
         ============================================================ -->
    <div id="viewSetup" class="view">
      <header class="hdr">
        <div class="hdr-title">COS 后期提示词生成器</div>
        <div class="hdr-sub">首次使用 · 填写你的 API 配置</div>
      </header>

      <section class="card">
        <label class="lbl">服务商预设（选一个自动填入地址和模型名）</label>
        <select id="providerPreset" class="inp">
          <option value="">— 选择服务商 —</option>
          <option value="deepseek">DeepSeek（深度求索）</option>
          <option value="qwen">通义千问（阿里）</option>
          <option value="kimi">Kimi / Moonshot（月之暗面）</option>
          <option value="zhipu">智谱 GLM</option>
          <option value="siliconflow">硅基流动 SiliconFlow</option>
          <option value="minimax">MiniMax</option>
          <option value="openai">OpenAI</option>
          <option value="openrouter">OpenRouter</option>
          <option value="custom">自定义</option>
        </select>

        <label class="lbl">接口地址（Base URL）</label>
        <input id="baseUrl" class="inp" placeholder="https://api.deepseek.com/v1" />

        <label class="lbl">API Key</label>
        <input id="apiKey" class="inp" type="password" placeholder="sk-..." />

        <label class="lbl">模型名</label>
        <input id="model" class="inp" placeholder="deepseek-chat" />

        <label class="lbl">默认输出格式</label>
        <select id="targetModel" class="inp">
          <option value="nanobanana">Nano Banana（插件预设信封）</option>
          <option value="midjourney">Midjourney（自然语言 + 参数）</option>
          <option value="comfyui">ComfyUI / SD（tag + 权重 + 参数）</option>
          <option value="novelai">NovelAI（Danbooru 标签）</option>
        </select>

        <label class="lbl">导出目录（一键导出用）</label>
        <div class="field-row">
          <input id="exportDir" class="inp" placeholder="点右侧「浏览…」选择目录" />
          <button id="btnPickDir" class="btn btn-sm">浏览…</button>
        </div>

        <div class="notice">
          <div class="notice-title">安全说明</div>
          <div>· 本插件<b>不内置任何密钥</b>，必须由你填入自己的 API Key</div>
          <div>· 配置<b>只保存在你本机</b>，除你指定的接口地址外不会发往任何第三方</div>
          <div>· 配置过一次后，下次打开直接进入主界面，无需重复填写</div>
        </div>
      </section>

      <button id="btnEnter" class="btn btn-primary btn-block">保存并进入 →</button>
      <div id="setupStatus" class="status"></div>
    </div>

    <!-- ============================================================
         视图 2：生成主界面
         ============================================================ -->
    <div id="viewMain" class="view hidden">
      <header class="hdr hdr-row">
        <div class="hdr-left">
          <div class="hdr-title">COS 提示词</div>
          <div class="hdr-sub" id="cfgSummary">—</div>
        </div>
        <div class="hdr-actions">
          <button id="btnNewChat" class="btn btn-sm btn-ghost">新对话</button>
          <button id="btnSettings" class="btn btn-sm btn-ghost">设置</button>
        </div>
      </header>

      <!-- 需求输入 -->
      <section class="card">
        <label class="lbl">输出格式</label>
        <select id="targetModelMain" class="inp">
          <option value="nanobanana">Nano Banana（插件预设信封）</option>
          <option value="midjourney">Midjourney（自然语言 + 参数）</option>
          <option value="comfyui">ComfyUI / SD（tag + 权重 + 参数）</option>
          <option value="novelai">NovelAI（Danbooru 标签）</option>
        </select>

        <label class="lbl">需求描述</label>
        <textarea id="request" class="ta ta-lg" rows="8"
          placeholder="把你想做的后期处理描述清楚，例如：&#10;· 给这张 COS 照脚下加一个金色魔法阵，CG 质感，明显一点&#10;· 修脸自然一点，祛痘印和黑眼圈，头发加点亮晶晶&#10;· 背景换成赛博朋克雨夜，冷色调，霓虹灯光"></textarea>

        <div class="chips">
          <span class="chip" data-tpl="给这张照片脚下加一个金色魔法阵，CG 质感，明显一点">加魔法阵</span>
          <span class="chip" data-tpl="修脸自然一点，祛痘印和黑眼圈，头发加点亮晶晶">修脸+亮晶晶发</span>
          <span class="chip" data-tpl="背景换成赛博朋克雨夜，冷色调，霓虹灯光">赛博夜景</span>
          <span class="chip" data-tpl="瘦腰，加沙漏身材，衣服绷紧一点">身材塑形</span>
          <span class="chip" data-tpl="想要王家卫电影那种感觉，霓虹撞色，雨夜街道">电影风格</span>
          <span class="chip" data-tpl="想要写实 3DCG 风格，电影级构图，大光圈虚化">3DCG风格</span>
        </div>

        <div class="row">
          <button id="gen" class="btn btn-primary">生成提示词</button>
          <button id="useDoc" class="btn btn-ghost btn-sm">带上文档信息</button>
        </div>
        <div id="status" class="status"></div>
      </section>

      <!-- 结果 + 迭代优化 -->
      <section class="card">
        <div class="card-head">
          <span>生成结果</span>
          <span class="card-actions">
            <button id="copy" class="btn btn-sm">复制</button>
            <button id="exportQuick" class="btn btn-sm">导出到目录</button>
            <button id="save" class="btn btn-sm btn-ghost">另存为…</button>
          </span>
        </div>
        <textarea id="output" class="ta out ta-lg" rows="12"
          placeholder="生成结果会显示在这里…"></textarea>

        <label class="lbl">继续优化（基于上面的结果提新要求）</label>
        <textarea id="refine" class="ta" rows="3"
          placeholder="例：把魔法阵改成蓝色；强度再高一点；背景换成夜景"></textarea>
        <div class="row">
          <button id="btnRefine" class="btn btn-primary">继续优化 →</button>
          <button id="btnRevert" class="btn btn-ghost btn-sm">撤销上一步</button>
        </div>
      </section>

      <!-- 历史记录 -->
      <section class="card">
        <div class="card-head">
          <span>历史记录 <span id="histCount" class="count">0</span></span>
          <span class="card-actions">
            <button id="clearHistory" class="btn btn-sm btn-ghost">清空</button>
          </span>
        </div>
        <div id="historyList" class="history">
          <div class="empty">暂无记录</div>
        </div>
      </section>
    </div>

  </div>
  <script src="index.js"></script>
</body>
</html>
